name: CI - Validar Projeto PDF OCR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar-codigo:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 3. Instalar dependências de sistema (Tesseract e Ghostscript)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por ghostscript

      - name: 4. Configurar Cache do Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 5. Instalar dependências e ferramentas de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pip-audit bandit

      - name: 6. Executar linting com Ruff
        run: ruff check .

      - name: 7. Executar análise de segurança de código com Bandit
        run: bandit -r . -ll

      - name: 8. Auditar dependências por vulnerabilidades
        run: pip-audit -r requirements.txt

      - name: 9. Executar testes automatizados
        run: |
          pytest --cov=pdf_ocr_converter --cov-report=term-missing

      - name: 10. Verificar sintaxe e importações
        run: |
          python -m py_compile pdf_ocr_converter.py
          python -c "import img2pdf, mammoth, ocrmypdf, pypdf, xhtml2pdf; from PIL import Image; print('Dependencias instaladas com sucesso.')"
